name: 🐞 Reportar un fallo
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: que
    attributes:
      label: ¿Qué pasó?
      description: Describe el fallo y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abro el Studio…
        2. Elijo…
        3. Aparece el error…
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Mensaje de error o captura
      description: Copia el error de la ventana de start.bat o de la consola del navegador (F12).
  - type: input
    id: equipo
    attributes:
      label: Tu equipo
      placeholder: Windows 11, RTX 4070 12 GB, 32 GB RAM, Ollama con qwen3:14b
